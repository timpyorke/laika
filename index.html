<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05283a" />
    <link rel="icon" type="image/svg+xml" href="/laika.svg" />
    <title>Laika</title>
    <!-- Paint the window in the resolved theme before React mounts, so the app
         never flashes the wrong ground colour on launch. -->
    <style>
      html, body { background: #05283a; }
      @media (prefers-color-scheme: light) { html, body { background: #f6f2e7; } }
    </style>
    <script>
      if (!window.matchMedia("(prefers-color-scheme: light)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
