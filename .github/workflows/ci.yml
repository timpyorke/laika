name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-windows-bundle:
    name: Quality gates and Windows bundle
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level moderate

      - name: Check security configuration
        run: pnpm security:check

      - name: Install Rust quality components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Select stable Rust
        run: rustup default stable

      - name: Verify release version
        run: pnpm version:check

      - name: Build frontend
        run: pnpm build

      - name: Test frontend
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned Windows installers
        run: pnpm tauri build --bundles nsis,msi --ci --no-sign

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: laika-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/laika.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  rust-dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          file: src-tauri/Cargo.lock
          createIssues: false
