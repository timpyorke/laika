name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-windows-bundle:
    name: Quality gates and Windows bundle
    uses: ./.github/workflows/build-windows.yml

  rust-dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          file: src-tauri/Cargo.lock
          createIssues: false

  performance-baseline:
    name: Informational Windows performance baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Capture release baseline
        shell: pwsh
        run: |
          $output = cargo run --release --manifest-path src-tauri/Cargo.toml --features performance --bin performance-baseline 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath performance-baseline.md
          exit $exitCode

      - name: Upload performance result
        uses: actions/upload-artifact@v7
        with:
          name: laika-performance-${{ github.sha }}
          path: performance-baseline.md
          if-no-files-found: error
          retention-days: 30
